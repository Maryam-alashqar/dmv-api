name: Deploy DMV API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install PHP dependencies
        # Only needed here so vendor/filament exists for the Filament theme
        # CSS (resources/css/filament/admin/theme.css) to import from when
        # building frontend assets below — the actual app's PHP dependencies
        # are installed separately on the VPS itself, later in this job.
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload built frontend assets
        run: |
          rsync -az --delete public/build/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/dmv-api/public/build/"

      - name: Deploy to VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e

            cd /var/www/dmv-api

            git fetch origin main
            git reset --hard origin/main

            composer install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            php artisan migrate --force
            php artisan storage:link --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache

            systemctl reload php8.3-fpm
          EOF
